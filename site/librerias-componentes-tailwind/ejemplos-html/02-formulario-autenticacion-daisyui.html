<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto 02: Formulario de Autenticación — DaisyUI</title>
  <!-- DaisyUI CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 text-base-content min-h-screen flex flex-col justify-center items-center p-4 font-sans transition-colors duration-200">

  <!-- SELECTOR DE TEMA FLOTANTE -->
  <div class="fixed top-4 right-4 z-50">
    <select class="select select-bordered select-sm shadow-md" onchange="document.documentElement.setAttribute('data-theme', this.value)">
      <option value="light">Tema: Claro</option>
      <option value="dark">Tema: Oscuro</option>
      <option value="corporate">Tema: Corporate</option>
      <option value="synthwave">Tema: Synthwave</option>
    </select>
  </div>

  <!-- TARJETA PRINCIPAL DEL FORMULARIO -->
  <main class="card w-full max-w-lg bg-base-100 shadow-2xl border border-base-300 my-8">
    <div class="card-body p-6 sm:p-8">
      
      <!-- CABECERA -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary/10 text-primary mb-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004 11m0 0a8 8 0 00.99 7.132"/></svg>
        </div>
        <h1 class="text-2xl font-black tracking-tight">Crear Cuenta de Alumno</h1>
        <p class="text-sm opacity-70 mt-1">Implementación con componentes DaisyUI y accesibilidad nativa.</p>
      </div>

      <!-- ALERTA GLOBAL DE VALIDACIÓN (FEEDBACK) -->
      <div class="alert alert-warning text-xs shadow-sm py-2 px-3 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-4 w-4" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
        <span>Revisa los campos señalados en rojo antes de enviar.</span>
      </div>

      <!-- FORMULARIO -->
      <form id="signup-form" class="space-y-4" onsubmit="event.preventDefault(); simulateSubmit();">

        <!-- CAMPO 1: NOMBRE COMPLETO CON FLOATING LABEL -->
        <div class="form-control w-full">
          <label class="label" for="fullname">
            <span class="label-text font-semibold">Nombre y Apellidos</span>
          </label>
          <label class="input input-bordered flex items-center gap-2">
            <svg class="w-4 h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <input type="text" id="fullname" class="grow" placeholder="Ej: María García López" required />
          </label>
        </div>

        <!-- CAMPO 2: CORREO ELECTRÓNICO (ESTADO ÉXITO) -->
        <div class="form-control w-full">
          <label class="label" for="email">
            <span class="label-text font-semibold">Correo Electrónico Institucional</span>
            <span class="label-text-alt text-success font-bold">✓ Formato válido</span>
          </label>
          <label class="input input-bordered input-success flex items-center gap-2">
            <svg class="w-4 h-4 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <input type="email" id="email" class="grow" value="maria.garcia@ies-antigravity.es" required />
          </label>
          <label class="label">
            <span class="label-text-alt text-success text-xs">Dominio educativo reconocido.</span>
          </label>
        </div>

        <!-- CAMPO 3: CONTRASEÑA (ESTADO ERROR CON ARIA-DESCRIBEDBY) -->
        <div class="form-control w-full">
          <label class="label" for="password">
            <span class="label-text font-semibold">Contraseña</span>
            <span class="label-text-alt text-error font-bold">Mínimo 8 caracteres</span>
          </label>
          <label class="input input-bordered input-error flex items-center gap-2">
            <svg class="w-4 h-4 text-error" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            <input type="password" id="password" class="grow" value="1234" aria-invalid="true" aria-describedby="pass-error-msg" required />
            <button type="button" class="btn btn-ghost btn-xs" onclick="togglePassword()">👁️</button>
          </label>
          <label class="label" id="pass-error-msg">
            <span class="label-text-alt text-error font-medium text-xs">La contraseña es demasiado corta. Debe contener letras mayúsculas, números y símbolos.</span>
          </label>
        </div>

        <!-- CAMPO 4: SELECTOR DESPLEGABLE (CICLO PROFESIONAL) -->
        <div class="form-control w-full">
          <label class="label" for="ciclo">
            <span class="label-text font-semibold">Ciclo Formativo</span>
          </label>
          <select id="ciclo" class="select select-bordered w-full">
            <option disabled selected>Selecciona tu titulación</option>
            <option value="DAW">DAW — Desarrollo de Aplicaciones Web</option>
            <option value="DAM">DAM — Desarrollo de Aplicaciones Multiplataforma</option>
            <option value="ASIR">ASIR — Administración de Sistemas Informáticos en Red</option>
          </select>
        </div>

        <!-- CAMPO 5: TOGGLE SWITCH DE TÉRMINOS Y CONDICIONES -->
        <div class="form-control pt-2">
          <label class="label cursor-pointer justify-start gap-3">
            <input type="checkbox" id="terms-toggle" class="toggle toggle-primary" checked />
            <span class="label-text text-sm">Acepto los términos de la plataforma y el código de conducta de FP</span>
          </label>
        </div>

        <!-- CAMPO 6: CAMPO DESHABILITADO (EJEMPLO RESILIENCIA) -->
        <div class="form-control w-full opacity-60">
          <label class="label">
            <span class="label-text text-xs">Identificador de Matrícula (Asignado automáticamente)</span>
          </label>
          <input type="text" value="FP-AND-2026-X9481" class="input input-bordered input-sm cursor-not-allowed" disabled />
        </div>

        <!-- BOTÓN DE ENVÍO CON SPINNER DINÁMICO -->
        <div class="pt-4">
          <button id="submit-btn" type="submit" class="btn btn-primary w-full text-base">
            Registrar Cuenta
          </button>
        </div>

      </form>

    </div>
  </main>

  <footer class="text-center text-xs opacity-60 pb-6">
    Proyecto 02: Formularios y Accesibilidad · DaisyUI
  </footer>

  <script>
    function togglePassword() {
      const pass = document.getElementById('password');
      pass.type = pass.type === 'password' ? 'text' : 'password';
    }

    function simulateSubmit() {
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading loading-spinner loading-sm"></span> Procesando solicitud...';
      
      setTimeout(() => {
        btn.disabled = false;
        btn.className = 'btn btn-success w-full text-base text-white';
        btn.innerHTML = '✓ ¡Registro Completado!';
      }, 2000);
    }
  </script>
</body>
</html>
